<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rueda de Percentiles · Constructor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Librería XLSX usada por el worker y por el fallback en el hilo principal -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* (Tu CSS exactamente igual que el original) */
  :root{
    --bg: #0B0D12;
    --panel: #12151C;
    --panel-2: #171B24;
    --border: #262B36;
    --gold: #B6935C;
    --gold-soft: rgba(182,147,92,.13);
    --ink: #E8EAEF;
    --ink-dim: #8B8F9C;
    --ink-faint: #565B68;
    --blue: #5B85D6;
    --green: #4C9A6E;
    --amber: #C79A52;
    --red: #BC5049;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{min-height:100vh;}
  ::selection{background:var(--gold-soft);}

  /* ---------- App shell ---------- */
  #app{display:grid;grid-template-columns:480px 1fr;min-height:100vh;}
  @media (max-width: 1180px){ #app{grid-template-columns:1fr;} }

  #sidebar{
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:22px 20px 60px;
    overflow-y:auto;
    max-height:100vh;
  }
  #main{
    padding:16px 24px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    overflow-y:auto;
    max-height:100vh;
  }

  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand .mark{
    width:28px;height:28px;border-radius:7px;
    background:var(--panel-2);
    border:1.5px solid var(--gold);
    position:relative;
    flex-shrink:0;
  }
  .brand .mark::after{
    content:'';position:absolute;inset:6px;border-radius:3px;border:1.5px solid var(--gold);opacity:.45;
  }
  .brand h1{font-family:var(--font-display);font-size:14.5px;font-weight:600;margin:0;letter-spacing:.1px;color:var(--ink);}
  .brand span{display:block;font-size:10.5px;color:var(--ink-faint);margin-top:1px;letter-spacing:.3px;}

  .step{
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel-2);
    margin-bottom:14px;
    overflow:hidden;
  }
  .step-head{
    display:flex;align-items:center;gap:10px;
    padding:13px 14px;cursor:pointer;user-select:none;
  }
  .step-head .num{
    width:20px;height:20px;border-radius:50%;
    background:var(--gold-soft);color:var(--gold);
    font-family:var(--font-mono);font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .step-head .title{font-family:var(--font-display);font-size:13.5px;font-weight:600;flex:1;}
  .step-head .chev{color:var(--ink-faint);font-size:11px;transition:transform .18s;}
  .step.collapsed .chev{transform:rotate(-90deg);}
  .step-body{padding:0 14px 16px;border-top:1px solid var(--border);}
  .step.collapsed .step-body{display:none;}
  .step-head + .step-body{padding-top:14px;}

  label.field-label{display:block;font-size:11px;color:var(--ink-dim);margin:10px 0 5px;letter-spacing:.2px;}
  select, input[type=text], input[type=number]{
    width:100%;background:#0D1220;border:1px solid var(--border);color:var(--ink);
    border-radius:7px;padding:8px 10px;font-size:12.5px;font-family:var(--font-body);
    outline:none;
  }
  select:focus, input:focus{border-color:var(--gold);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  button{font-family:var(--font-body);cursor:pointer;border:none;outline:none;}
  .btn{
    background:#0D1220;border:1px solid var(--border);color:var(--ink);
    padding:8px 12px;border-radius:7px;font-size:12px;font-weight:600;
  }
  .btn:hover{border-color:var(--gold);}
  .btn-gold{background:var(--gold);color:#1a1206;border-color:var(--gold);}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px dashed var(--border);color:var(--ink-dim);width:100%;padding:9px;}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
  .btn-sm{padding:4px 8px;font-size:11px;border-radius:5px;}
  .btn-icon{background:transparent;border:1px solid var(--border);width:24px;height:24px;border-radius:5px;color:var(--ink-dim);display:inline-flex;align-items:center;justify-content:center;font-size:11px;}
  .btn-icon:hover{color:var(--red);border-color:var(--red);}

  .helptext{font-size:11px;color:var(--ink-faint);line-height:1.5;margin-top:6px;}
  .pill-count{
    font-family:var(--font-mono);font-size:11px;color:var(--gold);
    background:var(--gold-soft);padding:2px 8px;border-radius:20px;
  }

  .dropzone{
    border:1.5px dashed var(--border);border-radius:10px;padding:22px 14px;
    text-align:center;color:var(--ink-dim);font-size:12px;transition:.15s;
  }
  .dropzone.drag{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);}
  .dropzone strong{color:var(--ink);}

  /* filter rules */
  .rule{display:grid;grid-template-columns:1fr 70px 1fr 24px;gap:6px;margin-bottom:6px;align-items:center;}

  /* preset box */
  .preset-box{
    background:#0D1220;border:1px solid var(--border);border-radius:9px;
    padding:10px 10px 12px;margin-bottom:14px;
  }
  .preset-box select{font-size:11.5px;}

  /* metric dropdown (buscable) */
  .metric-dd{position:relative;flex:1;min-width:0;}
  .dd-btn{
    width:100%;text-align:left;background:#0D1220;border:1px solid var(--border);color:var(--ink);
    padding:6px 8px;border-radius:6px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .dd-btn:hover{border-color:var(--gold);}
  .dd-panel{
    position:absolute;top:calc(100% + 4px);left:0;z-index:80;
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    width:270px;max-height:260px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 12px 32px rgba(0,0,0,.55);
  }
  .dd-search{margin:8px 8px 4px;width:calc(100% - 16px);}
  .dd-list{overflow-y:auto;max-height:200px;padding:2px 6px 8px;}
  .dd-item{padding:6px 8px;font-size:11.5px;border-radius:5px;cursor:pointer;color:var(--ink-dim);}
  .dd-item:hover{background:var(--gold-soft);color:var(--gold);}
  .dd-item.sel{color:var(--gold);font-weight:600;}
  .dd-empty{padding:10px;font-size:11px;color:var(--ink-faint);text-align:center;}

  /* etiqueta editable dentro de la fila de metrica */
  .metric-label-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .metric-label-input{font-size:11.5px;padding:6px 8px;}
  .metric-src{font-size:9.5px;color:var(--ink-faint);padding-left:8px;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---- modal de seleccion de estadisticas ---- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(4,6,12,.72);backdrop-filter:blur(2px);
    z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .modal-panel{
    width:100%;max-width:680px;max-height:82vh;display:flex;flex-direction:column;
    background:var(--panel-2);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;
  }
  .modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--border);}
  .modal-header h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:600;}
  .modal-search{margin:14px 20px 6px;width:calc(100% - 40px);padding:10px 12px;font-size:13px;}
  .modal-grid{
    flex:1;overflow-y:auto;padding:10px 20px 16px;
    display:grid;grid-template-columns:repeat(auto-fill, minmax(190px,1fr));gap:8px;
    align-content:start;
  }
  .modal-item{
    display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--border);
    border-radius:9px;background:#0D1220;cursor:pointer;font-size:12px;color:var(--ink-dim);
    transition:.12s;user-select:none;
  }
  .modal-item:hover{border-color:var(--gold);color:var(--ink);}
  .modal-item.sel{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);font-weight:600;}
  .modal-item-check{
    width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-item.sel .modal-item-check{background:var(--gold);border-color:var(--gold);}
  .modal-item.sel .modal-item-check::after{content:'✓';font-size:10px;color:#1a1206;font-weight:900;}
  .modal-footer{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 20px;border-top:1px solid var(--border);
  }

  /* category card */
  .cat-card{border:1px solid var(--border);border-radius:9px;margin-bottom:10px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#0D1220;}
  .cat-swatch{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid rgba(255,255,255,.15);}
  .cat-head input[type=text]{flex:1;padding:5px 8px;font-size:12px;}
  .cat-body{padding:8px 10px 10px;}
  .metric-row{
    display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;
    padding:6px 0;border-bottom:1px solid #1c2334;
  }
  .metric-row:last-child{border-bottom:none;}
  .metric-row select{font-size:11.5px;padding:6px 8px;}
  .toggle{
    display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-faint);
    border:1px solid var(--border);border-radius:5px;padding:4px 6px;cursor:pointer;
  }
  .toggle.on{color:var(--gold);border-color:var(--gold);background:var(--gold-soft);}

  /* main preview */
  #result-row{
    display:flex; gap:14px; align-items:flex-start; justify-content:center;
    width:100%; max-width:1220px;
  }
  #wheel-wrap, .wheel-wrap-card{
    background:radial-gradient(circle at 50% 20%, #10182a, var(--bg) 70%);
    border:1px solid var(--border);border-radius:16px;
    padding:14px 18px; width:100%; max-width:780px; flex-shrink:0;
  }
  .wheel-wrap-card{ max-width:520px; }
  /* pestañas Rueda individual / Comparación */
  .mode-tab{ transition:background .2s ease, border-color .2s ease, color .2s ease; }
  /* tabla comparativa */
  .cmp-row{ transition:background .2s ease; }
  .cmp-row:hover{ background:rgba(255,255,255,.02); }
  #export-bar{display:flex;gap:10px;width:100%;max-width:1220px;justify-content:flex-end;}
  #empty-state{
    color:var(--ink-faint);text-align:center;padding:80px 20px;font-size:13px;line-height:1.7;
  }
  #empty-state b{color:var(--ink-dim);}

  /* panel de ranking (se abre al click en una métrica de la rueda) */
  #ranking-panel{
    width:100%; max-width:380px; flex-shrink:0;
    background:var(--panel-2); border:1px solid var(--border); border-radius:16px;
    padding:18px; max-height:820px; display:flex; flex-direction:column;
    animation: rankIn .22s ease-out;
  }
  @keyframes rankIn{ from{ opacity:0; transform:translateX(8px); } to{ opacity:1; transform:translateX(0); } }
  /* fade-in genérico y sutil (200-300ms) para contenido que se reconstruye:
     el bloque de percentil grande y el swap Ranking/Distribución. */
  @keyframes fadeInFast{ from{ opacity:0; transform:translateY(3px); } to{ opacity:1; transform:translateY(0); } }
  .fade-in{ animation: fadeInFast .22s ease-out; }
  .rank-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .rank-head h3{margin:0;font-family:var(--font-display);font-size:14.5px;font-weight:600;}
  .rank-sub{font-size:11px;color:var(--ink-faint);margin-bottom:12px;}
  .rank-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:3px;}
  .rank-row{
    display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;
    padding:7px 8px;border-radius:7px;font-size:12px;
    transition:background .2s ease;
  }
  .rank-row .rk-num{color:var(--ink-faint);font-family:var(--font-mono);font-size:11px;}
  .rank-row .rk-name{color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-row .rk-val{color:var(--ink-dim);font-family:var(--font-mono);font-size:11.5px;}
  .rank-row.me{background:var(--gold-soft);}
  .rank-row.me .rk-num, .rank-row.me .rk-name, .rank-row.me .rk-val{color:var(--gold);font-weight:700;}
  .metric-wedge{cursor:pointer;}
  .metric-wedge .wedge-fill, .metric-wedge .wedge-track{transition:filter .2s ease, opacity .2s ease;}
  .metric-wedge:hover .wedge-fill{filter:brightness(1.15);}
  .metric-wedge:hover .wedge-track{filter:brightness(1.3);}

  /* tooltip enriquecido de la rueda (hover sobre una métrica) */
  #wheel-tooltip{
    position:absolute; z-index:60; pointer-events:none;
    background:var(--panel-2); border:1px solid var(--gold); border-radius:9px;
    padding:10px 12px; min-width:160px;
    box-shadow:0 10px 28px rgba(0,0,0,.5);
    opacity:0; transform:translateY(3px) scale(.98);
    transition:opacity .18s ease, transform .18s ease;
    visibility:hidden;
  }
  #wheel-tooltip.show{ opacity:1; transform:translateY(0) scale(1); visibility:visible; }
  #wheel-tooltip .wtt-title{font-family:var(--font-display);font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  #wheel-tooltip .wtt-row{display:flex;justify-content:space-between;gap:14px;font-size:11px;color:var(--ink-faint);padding:2px 0;}
  #wheel-tooltip .wtt-row b{color:var(--ink-dim);font-family:var(--font-mono);font-weight:700;font-size:11px;}
  #wheel-tooltip .wtt-cat{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--gold);font-weight:700;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#232c40;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<!-- IMPORTANT: cargamos app.js como módulo para que "import './presets.js'" funcione -->
<script type="module" src="app.js?v=20260731-compare-module-split"></script>
</body>
</html>
